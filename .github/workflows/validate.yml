name: Validate

on:
  push:
    branches: [master, ux]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: home-assistant/actions/hassfest@f6f29a7ee3fa0eccadf3620a7b9ee00ab54ec03b  # master pinned 2026-05-07

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hacs/action@dcb30e72781db3f207d5236b861172774ab0b485  # main pinned 2026-05-07
        with:
          category: integration
          comment: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: github:kaitai-io/kaitai_struct_compiler
      - run: npm --prefix frontend ci --ignore-scripts
      - run: npm --prefix frontend exec -- playwright install --with-deps webkit
      - run: make check

  package:
    name: Package
    if: ${{ github.ref == 'refs/heads/ux' || github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: github:kaitai-io/kaitai_struct_compiler
      - run: uv sync --locked
      - name: Build reference package
        run: |
          make clean package
          uv run --no-sync python scripts/package.py \
            --source custom_components/ha_govee_led_ble \
            --verify-archive dist/ha_govee_led_ble.zip
          cp dist/ha_govee_led_ble.zip "$RUNNER_TEMP/ha_govee_led_ble-first.zip"
          cp dist/ha_govee_led_ble.zip.sha256 "$RUNNER_TEMP/ha_govee_led_ble-first.zip.sha256"
      - name: Rebuild package deterministically
        run: |
          make clean package
          cmp "$RUNNER_TEMP/ha_govee_led_ble-first.zip" dist/ha_govee_led_ble.zip
          cmp "$RUNNER_TEMP/ha_govee_led_ble-first.zip.sha256" dist/ha_govee_led_ble.zip.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-${{ github.sha }}
          path: |
            dist/ha_govee_led_ble.zip
            dist/ha_govee_led_ble.zip.sha256
          if-no-files-found: error
          retention-days: 7
