name: Validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: home-assistant/actions/hassfest@f6f29a7ee3fa0eccadf3620a7b9ee00ab54ec03b  # master pinned 2026-05-07

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hacs/action@dcb30e72781db3f207d5236b861172774ab0b485  # main pinned 2026-05-07
        with:
          category: integration
          comment: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

  browser:
    name: Browser tests
    needs: core
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.core.outputs.fixture_artifact_id }}
          path: frontend/tests/fixtures
      - run: npm --prefix frontend ci --ignore-scripts
      - run: npm --prefix frontend run test:browser

  core:
    name: Core checks
    needs: build
    runs-on: ubuntu-latest
    outputs:
      fixture_artifact_id: ${{ steps.fixtures.outputs.artifact-id }}
    env:
      UV_CACHE_DIR: /tmp/.uv-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - id: runner-image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      # Release commits change uv.lock, so fall back to the newest cache with the same image and Python.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ steps.runner-image.outputs.os }}-${{ runner.arch }}-${{ hashFiles('.python-version') }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ steps.runner-image.outputs.os }}-${{ runner.arch }}-${{ hashFiles('.python-version') }}-
      - name: Install project dependencies
        run: |
          uv sync --locked
          npm --prefix frontend ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: .build/ci-package
      - name: Verify build artifact checksum
        working-directory: .build/ci-package
        run: sha256sum --check ha_govee_led_ble.zip.sha256
      - name: Restore generated build outputs
        run: |
          # Keep checkout sources and avoid restoring ZIP timestamps older than the build inputs.
          unzip -q -n -DD .build/ci-package/ha_govee_led_ble.zip -d custom_components/ha_govee_led_ble
          uv run --no-sync python scripts/package.py \
            --source custom_components/ha_govee_led_ble \
            --verify-archive .build/ci-package/ha_govee_led_ble.zip
      # mypy validates each cached module itself, so any earlier cache is a safe starting point.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: mypy-${{ runner.os }}-${{ runner.arch }}-
      - run: make check-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: fixtures
        with:
          name: frontend-contracts-${{ github.sha }}-${{ github.run_attempt }}
          path: frontend/tests/fixtures/backend-contracts.json
          if-no-files-found: error
          retention-days: 7
      - run: uv cache prune --ci

  check:
    name: Check
    if: ${{ always() }}
    needs: [core, browser, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require code, browser and reproducibility checks
        env:
          CORE_RESULT: ${{ needs.core.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          if [[ "$CORE_RESULT" != "success" || "$BROWSER_RESULT" != "success" || "$PACKAGE_RESULT" != "success" ]]; then
            echo "::error::Core checks: $CORE_RESULT; browser tests: $BROWSER_RESULT; package: $PACKAGE_RESULT"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5
        with:
          install_args: github:kaitai-io/kaitai_struct_compiler
      - name: Build reference package
        run: |
          make clean build
          uv run --no-project --python "$(cat .python-version)" python scripts/package.py \
            --source custom_components/ha_govee_led_ble \
            --output dist/ha_govee_led_ble.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: upload
        with:
          name: package-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/ha_govee_led_ble.zip
            dist/ha_govee_led_ble.zip.sha256
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package
    needs: build
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: /tmp/.uv-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - id: runner-image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      # Release commits change uv.lock, so fall back to the newest cache with the same image and Python.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ steps.runner-image.outputs.os }}-${{ runner.arch }}-${{ hashFiles('.python-version') }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ steps.runner-image.outputs.os }}-${{ runner.arch }}-${{ hashFiles('.python-version') }}-
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5
        with:
          install_args: github:kaitai-io/kaitai_struct_compiler
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/reference-package
      - name: Verify reference package checksum
        working-directory: ${{ runner.temp }}/reference-package
        run: sha256sum --check ha_govee_led_ble.zip.sha256
      - name: Rebuild package deterministically
        run: |
          make clean package
          cmp "$RUNNER_TEMP/reference-package/ha_govee_led_ble.zip" dist/ha_govee_led_ble.zip
          cmp "$RUNNER_TEMP/reference-package/ha_govee_led_ble.zip.sha256" dist/ha_govee_led_ble.zip.sha256
      - run: uv cache prune --ci
