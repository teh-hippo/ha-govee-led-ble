name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Publication channel (stable remains the default)
        required: true
        default: stable
        type: choice
        options:
          - stable
          - rc
      force_major:
        description: Intentionally start the next major version, with notes since the last stable release
        required: false
        default: false
        type: boolean
  # Admission below requires same-repository master validation and rechecks the exact current SHA before executable steps.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Validate]
    types: [completed]
    branches: [master]

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name == 'workflow_run' && 'rc' || inputs.release_type || 'stable' }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    # Each workflow lane admits one run, so only one RC and one stable run can reach this lock.
    concurrency:
      group: release-master-publication
      cancel-in-progress: false
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       !startsWith(github.event.workflow_run.head_commit.message, 'chore(release): '))
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RELEASE_CHANNEL: ${{ github.event_name == 'workflow_run' && 'rc' || inputs.release_type || 'stable' }}
      FORCE_MAJOR: ${{ github.event_name == 'workflow_dispatch' && inputs.force_major || false }}
      UV_CACHE_DIR: /tmp/.uv-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: false

      - name: Require current, validated master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RELEASE_CHANNEL" in
            stable|rc) ;;
            *) echo "::error::Unknown release channel"; exit 1 ;;
          esac
          master_sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [[ "$SOURCE_SHA" != "$master_sha" ]]; then
            echo "::error::Master has advanced; release only its current validated commit."
            exit 1
          fi
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow validate.yml --branch master --commit "$SOURCE_SHA" --limit 20 \
            --json event,conclusion \
            --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0].conclusion // ""')"
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::Current master needs a successful Validate run before publication."
            exit 1
          fi
          git checkout -B master "$SOURCE_SHA"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Resolve Python cache identity
        id: cache-identity
        run: |
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
          uv run --no-sync python -c \
            'import platform, sysconfig; print("python="+platform.python_version()+"-"+str(sysconfig.get_config_var("SOABI")))' \
            >> "$GITHUB_OUTPUT"

      # Default-branch cache scope and exact validated-master admission exclude PR caches.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-v2-${{ steps.cache-identity.outputs.os }}-${{ runner.arch }}-${{ steps.cache-identity.outputs.python }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'uv.toml', '.python-version') }}-release
          restore-keys: uv-v2-${{ steps.cache-identity.outputs.os }}-${{ runner.arch }}-${{ steps.cache-identity.outputs.python }}-

      - name: Select release history
        run: |
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-pr-[0-9]+\.[0-9]+$ ]] ||
               [[ ( "$RELEASE_CHANNEL" == stable || "$FORCE_MAJOR" == true ) &&
                  "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
              git tag --delete "$tag"
            fi
          done < <(git tag --list)

      - name: Python Semantic Release
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          args=(version --no-changelog --no-vcs-release)
          if [[ "$RELEASE_CHANNEL" == "rc" ]]; then
            args+=(--as-prerelease --prerelease-token rc)
          fi
          case "$FORCE_MAJOR" in
            false) ;;
            true) args+=(--major) ;;
            *) echo "::error::Unknown major-release selection"; exit 1 ;;
          esac
          semantic_release=(uvx --from python-semantic-release==10.6.1 --with gitpython==3.1.59 semantic-release)
          next_version="$(GITHUB_OUTPUT=/dev/null "${semantic_release[@]}" "${args[@]}" --print)"
          current_version="$(jq -er .version custom_components/ha_govee_led_ble/manifest.json)"
          if ! printf '%s\n' "${current_version%%-*}" "${next_version%%-*}" | sort -V -C; then
            echo "::error::Calculated version is older than master. Select force_major to finalise an intentional major candidate."
            exit 1
          fi
          if [[ "$FORCE_MAJOR" == true ]]; then
            existing_tag="$(git ls-remote origin "refs/tags/v$next_version")"
            if [[ -n "$existing_tag" ]]; then
              echo "::error::That version already exists. Use normal RC calculation or same-tag recovery, not another forced major."
              exit 1
            fi
          fi
          "${semantic_release[@]}" "${args[@]}"

      - name: Save release identity and generated notes
        if: ${{ steps.semantic_release.outputs.released == 'true' }}
        env:
          RELEASE_NOTES: ${{ steps.semantic_release.outputs.release_notes }}
          RELEASE_TAG: ${{ steps.semantic_release.outputs.tag }}
          RELEASE_SHA: ${{ steps.semantic_release.outputs.commit_sha }}
          IS_PRERELEASE: ${{ steps.semantic_release.outputs.is_prerelease }}
        run: |
          mkdir -p release-metadata
          printf '%s\n' "$RELEASE_NOTES" > release-metadata/release-notes.md
          printf '%s\n' "$RELEASE_TAG" > release-metadata/tag
          printf '%s\n' "$RELEASE_SHA" > release-metadata/commit
          printf '%s\n' "$IS_PRERELEASE" > release-metadata/prerelease

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ steps.semantic_release.outputs.released == 'true' }}
        with:
          name: release-${{ steps.semantic_release.outputs.tag }}
          path: release-metadata/
          if-no-files-found: error

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: ${{ steps.semantic_release.outputs.released == 'true' }}
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
        if: ${{ steps.semantic_release.outputs.released == 'true' }}
        with:
          install_args: github:kaitai-io/kaitai_struct_compiler

      - name: Build and verify deterministic package
        if: ${{ steps.semantic_release.outputs.released == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.semantic_release.outputs.tag }}
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git checkout -B master "$RELEASE_TAG"
          uv sync --locked
          make clean package
          uv run --no-sync python scripts/package.py \
            --source custom_components/ha_govee_led_ble \
            --verify-archive dist/ha_govee_led_ble.zip
          (cd dist && sha256sum --check ha_govee_led_ble.zip.sha256)

      - name: Retain source-built dependency wheels
        # Successful no-release runs also create uvx environments, which must never be saved.
        run: uv cache prune --ci

      - name: Publish verified release
        if: ${{ steps.semantic_release.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.semantic_release.outputs.tag }}
          RELEASE_SHA: ${{ steps.semantic_release.outputs.commit_sha }}
          IS_PRERELEASE: ${{ steps.semantic_release.outputs.is_prerelease }}
        run: |
          bash scripts/publish-release.sh "$RELEASE_TAG" "$RELEASE_SHA" "$IS_PRERELEASE" \
            release-metadata/release-notes.md \
            dist/ha_govee_led_ble.zip dist/ha_govee_led_ble.zip.sha256 uv.lock
