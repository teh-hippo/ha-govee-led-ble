name: Release

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Attach validated commit to master
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: git checkout -B master "$VALIDATED_SHA"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Python Semantic Release
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          uvx \
            --from python-semantic-release==10.6.1 \
            --with gitpython==3.1.59 \
            semantic-release version --no-changelog

      - name: Apply curated release notes
        if: ${{ steps.semantic_release.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.semantic_release.outputs.tag }}
        run: |
          notes_file=".github/release-notes/${RELEASE_TAG#v}.md"
          if [[ -f "$notes_file" ]]; then
            gh release edit "$RELEASE_TAG" --notes-file "$notes_file"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: ${{ steps.semantic_release.outputs.released == 'true' }}
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        if: ${{ steps.semantic_release.outputs.released == 'true' }}
        with:
          install_args: github:kaitai-io/kaitai_struct_compiler

      - name: Attach deterministic package
        if: ${{ steps.semantic_release.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.semantic_release.outputs.tag }}
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git checkout --detach "$RELEASE_TAG"
          uv sync --locked
          make clean package
          uv run --no-sync python scripts/package.py \
            --source custom_components/ha_govee_led_ble \
            --verify-archive dist/ha_govee_led_ble.zip
          (cd dist && sha256sum --check ha_govee_led_ble.zip.sha256)
          gh release upload "$RELEASE_TAG" \
            dist/ha_govee_led_ble.zip \
            dist/ha_govee_led_ble.zip.sha256

      - name: Move latest tag to current release
        if: ${{ steps.semantic_release.outputs.released == 'true' && steps.semantic_release.outputs.is_prerelease == 'false' }}
        env:
          RELEASE_TAG: ${{ steps.semantic_release.outputs.tag }}
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git tag --force latest "$release_commit"
          git push --force origin refs/tags/latest
