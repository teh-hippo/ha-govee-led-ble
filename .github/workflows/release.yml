name: Release

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release): ')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Attach validated commit to master
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: git checkout -B master "$VALIDATED_SHA"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Python Semantic Release
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          uvx \
            --from python-semantic-release==10.6.1 \
            --with gitpython==3.1.59 \
            semantic-release version --no-changelog --no-vcs-release

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: ${{ steps.semantic_release.outputs.released == 'true' }}
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        if: ${{ steps.semantic_release.outputs.released == 'true' }}
        with:
          install_args: github:kaitai-io/kaitai_struct_compiler

      - name: Build and publish deterministic package
        if: ${{ steps.semantic_release.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.semantic_release.outputs.tag }}
          RELEASE_NOTES: ${{ steps.semantic_release.outputs.release_notes }}
          IS_PRERELEASE: ${{ steps.semantic_release.outputs.is_prerelease }}
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git checkout --detach "$RELEASE_TAG"
          uv sync --locked
          make clean package
          uv run --no-sync python scripts/package.py \
            --source custom_components/ha_govee_led_ble \
            --verify-archive dist/ha_govee_led_ble.zip
          (cd dist && sha256sum --check ha_govee_led_ble.zip.sha256)
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes "$RELEASE_NOTES" \
            --prerelease="$IS_PRERELEASE" \
            dist/ha_govee_led_ble.zip \
            dist/ha_govee_led_ble.zip.sha256 \
            uv.lock

      - name: Move latest tag to current release
        if: ${{ steps.semantic_release.outputs.released == 'true' && steps.semantic_release.outputs.is_prerelease == 'false' }}
        env:
          RELEASE_TAG: ${{ steps.semantic_release.outputs.tag }}
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git tag --force latest "$release_commit"
          git push --force origin refs/tags/latest
