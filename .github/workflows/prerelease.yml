name: Prerelease Package

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact commit SHA from the selected branch
        required: true
        type: string
      version:
        description: Prerelease version, for example 7.2.0-rc.4.foundation
        required: true
        type: string
      publish:
        description: Create the GitHub prerelease and tag
        required: true
        default: false
        type: boolean
      release_notes:
        description: Exact maintainer-approved public release notes, required when publishing
        required: false
        default: ""
        type: string

concurrency:
  group: prerelease-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  package:
    uses: teh-hippo/common-repo-configs/.github/workflows/ha-prerelease.yml@b6757ad28cf4fae44c99a5a462bc14cf19dce1ab # v3.5.0
    permissions:
      contents: write
    with:
      integration: ha_govee_led_ble
      target_sha: ${{ inputs.target_sha }}
      version: ${{ inputs.version }}
      publish: ${{ inputs.publish }}
      release_notes: ${{ inputs.release_notes }}
      make_target: package
      node_version_file: .node-version
      mise_install_args: github:kaitai-io/kaitai_struct_compiler
