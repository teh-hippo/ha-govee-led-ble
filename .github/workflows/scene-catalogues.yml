name: Scene catalogue drift

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

concurrency:
  group: scene-catalogue-drift
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check committed snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: github:kaitai-io/kaitai_struct_compiler
      - run: uv sync --locked
      - run: make protocol
      - run: uv run --no-sync python tools/ble/refresh_scene_catalogues.py --check
