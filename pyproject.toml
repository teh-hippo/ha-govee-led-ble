[project]
name = "ha-govee-led-ble"
version = "6.0.0"
description = "Home Assistant custom integration for Govee BLE LED lights"
requires-python = ">=3.14.2,<3.15"
license = "MIT"
dependencies = [
    "bleak>=0.21.0",
    "bleak-retry-connector>=3.0.0",
    "kaitaistruct==0.11",
]

[dependency-groups]
dev = [
    "aiousbwatcher>=1.1.1",
    "mypy>=1.15",
    # Drags in homeassistant, which pins Pillow to an exact version. That pin is currently
    # behind Pillow's security releases, which is where the open advisories come from. Do NOT
    # add a uv override to force it forward: the point of this dependency is to test against
    # what Home Assistant actually ships, and overriding it tests something nobody runs.
    # Pillow is test-only and never ships with the integration. Wait for upstream.
    "pytest-homeassistant-custom-component>=0.13.316",
    "pyserial>=3.5",
    "ruff>=0.9",
    "serialx[esphome]>=1.8.2",
    "pyyaml>=6.0.3",
    "defusedxml>=0.7.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = ["custom_components/ha_govee_led_ble/generated_protocol/*"]

[tool.coverage.report]
fail_under = 90

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "bleak",
    "bleak.*",
    "bleak_retry_connector.*",
    "homeassistant.*",
    "kaitaistruct",
    "kaitaistruct.*",
    "pytest_homeassistant_custom_component.*",
    # pymobiledevice3 is a uv TOOL, deliberately not a project dependency: only the harness
    # needs it, it never ships with the integration, and adding it here would drag a large
    # iOS stack into every install. tools/harness/ax.py imports it lazily for that reason.
    "pymobiledevice3.*",
    # defusedxml ships no stubs. The harness parses WDA's element tree, which is untrusted
    # input from a third-party app, so the hardened parser is the right one to use.
    "defusedxml.*",
]
ignore_missing_imports = true
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false
disable_error_code = ["arg-type", "attr-defined", "no-untyped-call", "typeddict-item"]

[tool.uv]
override-dependencies = [
    "PyJWT>=2.12.0",
    "pytest>=9.0.3",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["custom_components/ha_govee_led_ble/manifest.json:version"]
build_command = "pip install uv && uv lock"
commit_message = "chore(release): {version}"
tag_format = "v{version}"
assets = ["uv.lock"]

[tool.semantic_release.commit_parser_options]
patch_tags = ["fix", "perf", "build"]
other_allowed_tags = ["chore", "ci", "docs", "style", "refactor", "test"]

[tool.semantic_release.branches.master]
match = "master"
prerelease = false

[tool.semantic_release.remote]
type = "github"
token = { env = "GITHUB_TOKEN" }
