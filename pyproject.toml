[project]
name = "ha-govee-led-ble"
version = "8.0.0-rc.66"
description = "Home Assistant custom integration for Govee BLE LED lights"
requires-python = ">=3.15,<3.16"
license = "MIT"
dependencies = [
    "bleak>=0.21.0",
    "bleak-retry-connector>=3.0.0",
    "kaitaistruct==0.11",
]

[dependency-groups]
dev = [
    "aiotools>=2.0",
    "bleak-esphome==4.1.0",
    "mypy>=1.15",
    # Home Assistant pins Pillow below its security fixes. Do not override that pin: tests
    # must match what HA ships. Pillow is test-only here and never bundled with the integration.
    "pytest-homeassistant[bluetooth]==2026.11.3",
    "pytest-cov>=7.1",
    "pytest-xdist>=3.8",
    "ruff>=0.9",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = ["custom_components/ha_govee_led_ble/generated_protocol/*"]

[tool.mypy]
python_version = "3.15"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "bleak",
    "bleak.*",
    "bleak_retry_connector.*",
    "homeassistant.*",
    "kaitaistruct",
    "kaitaistruct.*",
    "pytest_homeassistant.*",
]
ignore_missing_imports = true
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false
disable_error_code = ["arg-type", "attr-defined", "no-untyped-call", "typeddict-item"]

[tool.uv]
required-version = ">=0.13.4"
override-dependencies = [
    "cryptography>=50.0.0",
    "PyJWT>=2.12.0",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["custom_components/ha_govee_led_ble/manifest.json:version"]
build_command = 'uv lock --upgrade-package "$PACKAGE_NAME"'
commit_message = "chore(release): {version}"
tag_format = "v{version}"
assets = ["uv.lock"]

[tool.semantic_release.commit_parser_options]
# Keep merge-commit parsing on so release-bearing merges remain in release notes when branch commits are fixups.
# feat:/fix: subjects become user-facing release notes; put implementation detail in the body.
ignore_merge_commits = false
patch_tags = ["fix", "perf", "build"]
other_allowed_tags = ["chore", "ci", "docs", "style", "refactor", "test"]

[tool.semantic_release.branches.master]
match = "master"
prerelease = false

[tool.semantic_release.remote]
type = "github"
token = { env = "GITHUB_TOKEN" }
