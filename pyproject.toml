[project]
name = "ha-govee-led-ble"
version = "7.26.5"
description = "Home Assistant custom integration for Govee BLE LED lights"
requires-python = ">=3.15,<3.16"
license = "MIT"
dependencies = [
    "bleak>=0.21.0",
    "bleak-retry-connector>=3.0.0",
    "kaitaistruct==0.11",
]

[dependency-groups]
dev = [
    "aiotools>=2.0",
    "aiousbwatcher>=1.1.1",
    "bleak-esphome==4.1.0",
    "mypy>=1.15",
    # Home Assistant pins Pillow below its security fixes. Do not override that pin: tests
    # must match what HA ships. Pillow is test-only here and never bundled with the integration.
    "pytest-homeassistant-custom-component>=0.13.374",
    "pytest-cov>=7.1",
    "pytest-xdist>=3.8",
    "ruff>=0.9",
    "serialx>=1.8.2",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = ["custom_components/ha_govee_led_ble/generated_protocol/*"]

[tool.mypy]
python_version = "3.15"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "bleak",
    "bleak.*",
    "bleak_retry_connector.*",
    "homeassistant.*",
    "kaitaistruct",
    "kaitaistruct.*",
    "pytest_homeassistant_custom_component.*",
]
ignore_missing_imports = true
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false
disable_error_code = ["arg-type", "attr-defined", "no-untyped-call", "typeddict-item"]

[tool.uv]
required-version = ">=0.13.4"
override-dependencies = [
    "cryptography>=50.0.0",
    "PyJWT>=2.12.0",
    "pytest>=9.0.3",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["custom_components/ha_govee_led_ble/manifest.json:version"]
build_command = "pip install uv && uv lock"
commit_message = "chore(release): {version}"
tag_format = "v{version}"
assets = ["uv.lock"]

[tool.semantic_release.commit_parser_options]
ignore_merge_commits = false
patch_tags = ["fix", "perf", "build"]
other_allowed_tags = ["chore", "ci", "docs", "style", "refactor", "test"]

[tool.semantic_release.branches.master]
match = "master"
prerelease = false

[tool.semantic_release.remote]
type = "github"
token = { env = "GITHUB_TOKEN" }
